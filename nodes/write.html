<style>
  .opcua-advanced { margin: 8px 0 12px; }
  .opcua-advanced summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
  .opcua-point-editor { box-sizing: border-box; display: inline-block; vertical-align: top; width: calc(100% - 110px); }
  .opcua-point-toolbar { display: flex; gap: 6px; margin-bottom: 8px; }
  .opcua-write-point-add { display: grid; gap: 6px; grid-template-columns: minmax(180px, 2fr) minmax(90px, 1fr) 110px auto; margin-bottom: 8px; }
  .opcua-write-point-add input, .opcua-write-point-add select { min-width: 0; width: 100%; }
  .opcua-point-list { border: 1px solid var(--red-ui-form-input-border-color, #ccc); border-radius: 2px; box-sizing: border-box; height: 180px; list-style: none; margin: 0 !important; overflow: auto; padding: 0 !important; width: 100%; }
  .opcua-point-list li { align-items: center; border-bottom: 1px solid var(--red-ui-secondary-border-color, #eee); display: flex; gap: 8px; min-height: 34px; padding: 4px 8px; }
  .opcua-point-list li:last-child { border-bottom: 0; }
  .opcua-point-list .opcua-point-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opcua-point-list .opcua-point-empty { color: var(--red-ui-form-placeholder-color, #888); justify-content: center; }
  .opcua-point-list .opcua-point-remove { border: 0; color: var(--red-ui-text-color, #555); flex: 0 0 auto; }
  .opcua-point-status { color: var(--red-ui-form-text-color, #666); font-size: 0.9em; margin-top: 5px; }
</style>
<script type="text/html" data-template-name="tier0-opcua-write">
  <div class="form-row"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <input type="hidden" id="node-input-nodeId">
  <input type="hidden" id="node-input-pointList">
  <input type="hidden" id="node-input-pointListFileName">
  <input type="file" id="node-input-pointFile" accept=".json,.csv,application/json,text/csv" style="display:none">
  <div class="form-row">
    <label>Points</label>
    <div class="opcua-point-editor">
      <div class="opcua-point-toolbar">
        <button type="button" class="red-ui-button" id="node-input-importPointList"><i class="fa fa-upload"></i> Import</button>
        <button type="button" class="red-ui-button" id="node-input-clearPointList"><i class="fa fa-trash"></i> Clear all</button>
      </div>
      <div class="opcua-write-point-add">
        <input type="text" id="node-input-newPointNodeId" placeholder="NodeId">
        <input type="text" id="node-input-newPointValue" placeholder="Value">
        <select id="node-input-newPointDataType"><option>String</option><option>Boolean</option><option>SByte</option><option>Byte</option><option>Int16</option><option>UInt16</option><option>Int32</option><option>UInt32</option><option>Int64</option><option>UInt64</option><option>Float</option><option>Double</option><option>DateTime</option><option>ByteString</option></select>
        <button type="button" class="red-ui-button" id="node-input-addPoint"><i class="fa fa-plus"></i> Add</button>
      </div>
      <ol class="opcua-point-list" id="node-input-pointListItems"></ol>
      <div class="opcua-point-status" id="node-input-pointListStatus">0 points</div>
    </div>
  </div>
  <details class="opcua-advanced">
    <summary>Advanced settings</summary>
    <div class="form-row"><label for="node-input-dataType">Default type</label><select id="node-input-dataType"><option>String</option><option>Boolean</option><option>SByte</option><option>Byte</option><option>Int16</option><option>UInt16</option><option>Int32</option><option>UInt32</option><option>Int64</option><option>UInt64</option><option>Float</option><option>Double</option><option>DateTime</option><option>ByteString</option></select></div>
    <div class="form-row"><label for="node-input-indexRange">Index range</label><input type="text" id="node-input-indexRange" placeholder="For example 0 or 2:5"></div>
    <div class="form-row"><label for="node-input-batchSize">Batch size</label><input type="number" id="node-input-batchSize"></div>
    <div class="form-row"><label for="node-input-outputMode">Output</label><select id="node-input-outputMode"><option value="batch">Batch</option><option value="split">One message per point</option></select></div>
  </details>
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
</script>
<script type="text/html" data-help-name="tier0-opcua-write">
  <section lang="zh-CN">
    <p>输出 2 为独立状态／异常消息：payload.level 为 info、warn 或 error。可连接 Debug、文件或日志服务；原有 Catch 和日志仍然有效。同类事件每 30 秒最多输出一次，下一次包含 suppressed 计数。输出不含原始值、凭据或完整错误文本。</p>
    <h3>写入（Write）</h3>
    <p>向一个或多个 OPC UA Variable 写值。服务器必须允许当前用户写入，值也必须能够转换为目标数据类型。</p>
    <h4>输入</h4>
    <ul>
      <li>单点：NodeId 来自节点配置、<code>msg.nodeId</code> 或 <code>msg.topic</code>，写入值来自 <code>msg.payload</code>。</li>
      <li>批量：通过编辑器、JSON 或 CSV 提供 <code>nodeId</code>、<code>value</code> 和可选 <code>dataType</code>。</li>
      <li>CSV 必须包含 <code>nodeId</code> 和 <code>value</code>；未指定类型时使用节点默认类型。</li>
      <li>Int64/UInt64 建议使用十进制字符串；超范围、小数和不安全的 Number 会在发送前被拒绝。</li>
      <li><code>indexRange</code> 可部分写入数组或矩阵。</li>
    </ul>
    <h4>输出</h4>
    <p>Batch 模式在 <code>msg.payload</code> 中返回每个 NodeId 的 StatusCode；Split 模式每个写入结果发送一条消息。应检查是否为 <code>Good</code>，不要只依赖节点未报异常。</p>
  </section>
  <hr>
  <section lang="en">
    <p>Output 2 emits status/error events with payload.level (info, warn, error). Connect it to Debug, file or logging nodes. Catch and existing logs remain supported. Repeats are limited to one per 30 seconds; the next matching event includes suppressed counts. Raw values, credentials and SDK error text are omitted.</p>
    <h3>Write</h3>
    <p>Writes values to one or more OPC UA Variables. The current user must have write access and each value must be convertible to the target data type.</p>
    <h4>Input</h4>
    <ul>
      <li>Single point: NodeId comes from the node setting, <code>msg.nodeId</code>, or <code>msg.topic</code>; the value comes from <code>msg.payload</code>.</li>
      <li>Batch: Supply <code>nodeId</code>, <code>value</code>, and optional <code>dataType</code> through the editor, JSON, or CSV.</li>
      <li>CSV requires <code>nodeId</code> and <code>value</code>. The node default type is used when <code>dataType</code> is omitted.</li>
      <li>Use decimal strings for Int64/UInt64. Out-of-range, fractional, and unsafe Number values are rejected before transmission.</li>
      <li>Use <code>indexRange</code> for partial array or matrix writes.</li>
    </ul>
    <h4>Output</h4>
    <p>Batch mode returns one StatusCode per NodeId in <code>msg.payload</code>. Split mode sends one message per write result. Check for <code>Good</code>; do not treat the absence of a node error as proof that every item succeeded.</p>
  </section>
</script>
<script type="text/javascript">
  RED.nodes.registerType('tier0-opcua-write', {
    category: 'OPC UA', color: '#c7e9f1', inputs: 1, outputs: 2, outputLabels: ['Data', 'Status / errors'], icon: 'font-awesome/fa-pencil',
    defaults: {
      connection: { value: '', type: 'tier0-opcua-connection', required: true },
      nodeId: { value: '' }, dataType: { value: 'String' },
      indexRange: { value: '' },
      pointList: { value: '' }, pointListFileName: { value: '' },
      batchSize: { value: 500, validate: RED.validators.number() },
      outputMode: { value: 'batch' }, name: { value: '' }
    },
    oneditprepare: function () {
      const points = new Map();

      const csvLine = (line) => {
        const fields = [];
        let value = '';
        let quoted = false;
        for (let index = 0; index < line.length; index += 1) {
          const character = line[index];
          if (character === '"') {
            if (quoted && line[index + 1] === '"') { value += '"'; index += 1; }
            else quoted = !quoted;
          } else if (character === ',' && !quoted) {
            fields.push(value.trim()); value = '';
          } else value += character;
        }
        fields.push(value.trim());
        return fields;
      };

      const parse = (content) => {
        const text = String(content || '').replace(/^\uFEFF/, '').trim();
        if (!text) return [];
        if (text.startsWith('[') || text.startsWith('{')) {
          const parsed = JSON.parse(text);
          return Array.isArray(parsed) ? parsed : (Array.isArray(parsed.items) ? parsed.items : [parsed]);
        }
        const lines = text.split(/\r?\n/).filter((line) => line.trim() && !line.trimStart().startsWith('#'));
        if (!lines.length) return [];
        const headers = csvLine(lines.shift());
        if (!headers.includes('nodeId')) throw new Error('CSV header must contain nodeId');
        if (!headers.includes('value')) throw new Error('CSV header must contain value');
        return lines.map((line) => {
          const values = csvLine(line);
          return Object.fromEntries(headers.map((header, index) => [header, values[index] || '']));
        });
      };

      const normalize = (item) => {
        const source = typeof item === 'string' ? { nodeId: item } : { ...(item || {}) };
        source.nodeId = String(source.nodeId || source.topic || '').trim();
        if (!source.nodeId) throw new Error('Point is missing nodeId');
        if (!Object.prototype.hasOwnProperty.call(source, 'value')) source.useInput = true;
        source.dataType = String(source.dataType || $('#node-input-dataType').val() || 'String');
        return source;
      };

      const valueText = (value) => {
        if (typeof value === 'string') return value;
        try { return JSON.stringify(value); } catch (_) { return String(value); }
      };

      const persist = () => {
        const items = [...points.values()];
        $('#node-input-pointList').val(items.length ? JSON.stringify(items) : '');
        if (items.length) $('#node-input-nodeId').val('');
        $('#node-input-pointListStatus').text(`${items.length} point${items.length === 1 ? '' : 's'}`);
      };

      const render = () => {
        const list = document.getElementById('node-input-pointListItems');
        list.textContent = '';
        if (!points.size) {
          const empty = document.createElement('li');
          empty.className = 'opcua-point-empty';
          empty.textContent = 'No points. Add a write item or import a file.';
          list.appendChild(empty);
        } else {
          const fragment = document.createDocumentFragment();
          points.forEach((point, nodeId) => {
            const row = document.createElement('li');
            const text = document.createElement('span');
            text.className = 'opcua-point-text';
            const shownValue = point.useInput ? '<from msg.payload>' : valueText(point.value);
            text.textContent = `${nodeId} = ${shownValue} (${point.dataType})`;
            text.title = text.textContent;
            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'red-ui-button opcua-point-remove';
            remove.title = `Remove ${nodeId}`;
            remove.innerHTML = '<i class="fa fa-times"></i>';
            remove.addEventListener('click', () => { points.delete(nodeId); render(); });
            row.append(text, remove);
            fragment.appendChild(row);
          });
          list.appendChild(fragment);
        }
        persist();
      };

      const merge = (items) => {
        items.forEach((item) => { const point = normalize(item); points.set(point.nodeId, point); });
        render();
      };

      try {
        const stored = $('#node-input-pointList').val();
        if (stored) merge(parse(stored));
        else if ($('#node-input-nodeId').val()) merge([{
          nodeId: $('#node-input-nodeId').val(),
          dataType: $('#node-input-dataType').val(),
          useInput: true
        }]);
        else render();
      } catch (error) {
        RED.notify(`Cannot load point list: ${error.message}`, 'error');
        render();
      }

      $('#node-input-addPoint').on('click', () => {
        try {
          merge([{
            nodeId: $('#node-input-newPointNodeId').val(),
            value: $('#node-input-newPointValue').val(),
            dataType: $('#node-input-newPointDataType').val()
          }]);
          $('#node-input-newPointNodeId, #node-input-newPointValue').val('');
          $('#node-input-newPointNodeId').focus();
        } catch (error) { RED.notify(error.message, 'error'); }
      });
      $('#node-input-newPointNodeId, #node-input-newPointValue').on('keydown', function (event) {
        if (event.key === 'Enter') { event.preventDefault(); $('#node-input-addPoint').click(); }
      });
      $('#node-input-importPointList').on('click', () => $('#node-input-pointFile').click());
      $('#node-input-pointFile').on('change', function () {
        const file = this.files && this.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const imported = parse(reader.result);
            merge(imported);
            $('#node-input-pointListFileName').val(file.name);
            RED.notify(`${imported.length} point(s) imported`, 'success');
          } catch (error) { RED.notify(`Import failed: ${error.message}`, 'error'); }
          $('#node-input-pointFile').val('');
        };
        reader.readAsText(file);
      });
      $('#node-input-clearPointList').on('click', () => {
        points.clear();
        $('#node-input-nodeId').val('');
        $('#node-input-pointListFileName').val('');
        render();
      });
    },
    label: function () { return this.name || 'tier0-opcua-write'; }
  });
</script>
