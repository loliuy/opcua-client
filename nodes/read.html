<style>
  .opcua-advanced { margin: 8px 0 12px; }
  .opcua-advanced summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
  .opcua-point-editor { box-sizing: border-box; display: inline-block; vertical-align: top; width: calc(100% - 110px); }
  .opcua-point-toolbar { display: flex; gap: 6px; margin-bottom: 8px; }
  .opcua-point-add { display: flex; gap: 6px; margin-bottom: 8px; }
  .opcua-point-add input { flex: 1; min-width: 0; }
  .opcua-point-list { border: 1px solid var(--red-ui-form-input-border-color, #ccc); border-radius: 2px; box-sizing: border-box; height: 180px; list-style: none; margin: 0 !important; overflow: auto; padding: 0 !important; width: 100%; }
  .opcua-point-list li { align-items: center; border-bottom: 1px solid var(--red-ui-secondary-border-color, #eee); display: flex; gap: 8px; min-height: 34px; padding: 4px 8px; }
  .opcua-point-list li:last-child { border-bottom: 0; }
  .opcua-point-list .opcua-point-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opcua-point-list .opcua-point-empty { color: var(--red-ui-form-placeholder-color, #888); justify-content: center; }
  .opcua-point-list .opcua-point-remove { border: 0; color: var(--red-ui-text-color, #555); flex: 0 0 auto; }
  .opcua-point-status { color: var(--red-ui-form-text-color, #666); font-size: 0.9em; margin-top: 5px; }
</style>
<script type="text/html" data-template-name="tier0-opcua-read">
  <div class="form-row"><label for="node-input-connection">Connection</label><input type="text" id="node-input-connection"></div>
  <input type="hidden" id="node-input-nodeId">
  <input type="hidden" id="node-input-pointList">
  <input type="hidden" id="node-input-pointListFileName">
  <input type="file" id="node-input-pointFile" accept=".json,.csv,application/json,text/csv" style="display:none">
  <div class="form-row">
    <label>Points</label>
    <div class="opcua-point-editor">
      <div class="opcua-point-toolbar">
        <button type="button" class="red-ui-button" id="node-input-importPointList"><i class="fa fa-upload"></i> Import</button>
        <button type="button" class="red-ui-button" id="node-input-clearPointList"><i class="fa fa-trash"></i> Clear all</button>
      </div>
      <div class="opcua-point-add">
        <input type="text" id="node-input-newPointNodeId" placeholder="NodeId, for example ns=2;s=Machine.Speed">
        <button type="button" class="red-ui-button" id="node-input-addPoint"><i class="fa fa-plus"></i> Add</button>
      </div>
      <ol class="opcua-point-list" id="node-input-pointListItems"></ol>
      <div class="opcua-point-status" id="node-input-pointListStatus">0 points</div>
    </div>
  </div>
  <details class="opcua-advanced">
    <summary>Advanced settings</summary>
    <div class="form-row"><label for="node-input-indexRange">Index range</label><input type="text" id="node-input-indexRange" placeholder="For example 0:9 or 0:1,2:3"></div>
    <div class="form-row"><label for="node-input-batchSize">Batch size</label><input type="number" id="node-input-batchSize"></div>
    <div class="form-row"><label for="node-input-outputMode">Output</label><select id="node-input-outputMode"><option value="batch">Batch</option><option value="split">One message per point</option></select></div>
    <div class="form-row"><label for="node-input-resultDetail">Result detail</label><select id="node-input-resultDetail"><option value="compact">Compact</option><option value="value">Value only</option><option value="full">Full metadata</option></select></div>
  </details>
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
</script>
<script type="text/html" data-help-name="tier0-opcua-read">
  <section lang="zh-CN">
    <h3>读取（Read）</h3>
    <p>每收到一条输入消息执行一次 OPC UA Read。它不是定时器；读取频率由上游 Inject、Function 或其他节点的触发频率决定。</p>
    <h4>输入</h4>
    <ul>
      <li>可在编辑器中添加 NodeId，或导入 JSON/CSV 点表；CSV 必须包含 <code>nodeId</code> 列。</li>
      <li>也可通过 <code>msg.payload</code> 或 <code>msg.items</code> 动态传入点表。</li>
      <li>单点读取可使用节点配置、<code>msg.nodeId</code> 或 <code>msg.topic</code>。</li>
      <li><code>indexRange</code> 可读取数组或矩阵的指定范围。</li>
    </ul>
    <h4>输出</h4>
    <ul>
      <li><b>Compact</b>：NodeId/alias、值、状态码和源时间戳，推荐用于采集。</li>
      <li><b>Value only</b>：批量时按点表顺序输出值数组，单点时输出标量。</li>
      <li><b>Full metadata</b>：同时输出完整点表描述和客户端诊断，适合排障。</li>
    </ul>
    <p>Int64/UInt64 超出 JavaScript 安全整数范围时以十进制字符串输出，避免累计量和计数器精度丢失。</p>
    <p>大点表会按照 Batch size 和服务器 OperationLimits 自动拆分为批量服务请求，不会逐点建立连接。</p>
  </section>
  <hr>
  <section lang="en">
    <h3>Read</h3>
    <p>Executes one OPC UA Read for each input message. It is not a timer; the upstream Inject, Function, or other node controls the read frequency.</p>
    <h4>Input</h4>
    <ul>
      <li>Add NodeIds in the editor or import a JSON/CSV point list. CSV requires a <code>nodeId</code> column.</li>
      <li>A dynamic point list may arrive in <code>msg.payload</code> or <code>msg.items</code>.</li>
      <li>A single point may come from the node setting, <code>msg.nodeId</code>, or <code>msg.topic</code>.</li>
      <li>Use <code>indexRange</code> to read part of an array or matrix.</li>
    </ul>
    <h4>Output</h4>
    <ul>
      <li><b>Compact</b>: NodeId/alias, value, status code, and source timestamp. Recommended for collection flows.</li>
      <li><b>Value only</b>: A value array in point-list order for batch reads, or a scalar for one point.</li>
      <li><b>Full metadata</b>: Full point descriptors and client diagnostics for troubleshooting.</li>
    </ul>
    <p>Int64/UInt64 values outside the JavaScript safe-integer range are emitted as decimal strings to preserve exact counters and totals.</p>
    <p>Large point lists are split according to Batch size and server OperationLimits. The node does not create one connection per point.</p>
  </section>
</script>
<script type="text/javascript">
  RED.nodes.registerType('tier0-opcua-read', {
    category: 'OPC UA', color: '#c7e9f1', inputs: 1, outputs: 1, icon: 'bridge.png',
    defaults: {
      connection: { value: '', type: 'tier0-opcua-connection', required: true },
      nodeId: { value: '' }, pointList: { value: '' }, pointListFileName: { value: '' },
      indexRange: { value: '' },
      batchSize: { value: 500, validate: RED.validators.number() },
      outputMode: { value: 'batch' }, resultDetail: { value: 'compact' },
      name: { value: '' }
    },
    oneditprepare: function () {
      const points = new Map();

      const csvLine = (line) => {
        const fields = [];
        let value = '';
        let quoted = false;
        for (let index = 0; index < line.length; index += 1) {
          const character = line[index];
          if (character === '"') {
            if (quoted && line[index + 1] === '"') { value += '"'; index += 1; }
            else quoted = !quoted;
          } else if (character === ',' && !quoted) {
            fields.push(value.trim()); value = '';
          } else value += character;
        }
        fields.push(value.trim());
        return fields;
      };

      const parse = (content) => {
        const text = String(content || '').replace(/^\uFEFF/, '').trim();
        if (!text) return [];
        if (text.startsWith('[') || text.startsWith('{')) {
          const parsed = JSON.parse(text);
          return Array.isArray(parsed) ? parsed : (Array.isArray(parsed.items) ? parsed.items : [parsed]);
        }
        const lines = text.split(/\r?\n/).filter((line) => line.trim() && !line.trimStart().startsWith('#'));
        if (!lines.length) return [];
        const headers = csvLine(lines.shift());
        if (!headers.includes('nodeId')) throw new Error('CSV header must contain nodeId');
        return lines.map((line) => {
          const values = csvLine(line);
          return Object.fromEntries(headers.map((header, index) => [header, values[index] || '']));
        });
      };

      const normalize = (item) => {
        const source = typeof item === 'string' ? { nodeId: item } : { ...(item || {}) };
        source.nodeId = String(source.nodeId || source.topic || '').trim();
        if (!source.nodeId) throw new Error('Point is missing nodeId');
        return source;
      };

      const persist = () => {
        const items = [...points.values()];
        $('#node-input-pointList').val(items.length ? JSON.stringify(items) : '');
        if (items.length) $('#node-input-nodeId').val('');
        $('#node-input-pointListStatus').text(`${items.length} point${items.length === 1 ? '' : 's'}`);
      };

      const render = () => {
        const list = document.getElementById('node-input-pointListItems');
        list.textContent = '';
        if (!points.size) {
          const empty = document.createElement('li');
          empty.className = 'opcua-point-empty';
          empty.textContent = 'No points. Add a NodeId or import a file.';
          list.appendChild(empty);
        } else {
          const fragment = document.createDocumentFragment();
          points.forEach((point, nodeId) => {
            const row = document.createElement('li');
            const text = document.createElement('span');
            text.className = 'opcua-point-text';
            text.textContent = point.alias ? `${point.alias} — ${nodeId}` : nodeId;
            text.title = text.textContent;
            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'red-ui-button opcua-point-remove';
            remove.title = `Remove ${nodeId}`;
            remove.innerHTML = '<i class="fa fa-times"></i>';
            remove.addEventListener('click', () => { points.delete(nodeId); render(); });
            row.append(text, remove);
            fragment.appendChild(row);
          });
          list.appendChild(fragment);
        }
        persist();
      };

      const merge = (items) => {
        items.forEach((item) => { const point = normalize(item); points.set(point.nodeId, point); });
        render();
      };

      try {
        const stored = $('#node-input-pointList').val();
        if (stored) merge(parse(stored));
        else if ($('#node-input-nodeId').val()) merge([{ nodeId: $('#node-input-nodeId').val() }]);
        else render();
      } catch (error) {
        RED.notify(`Cannot load point list: ${error.message}`, 'error');
        render();
      }

      $('#node-input-addPoint').on('click', () => {
        try {
          merge([{ nodeId: $('#node-input-newPointNodeId').val() }]);
          $('#node-input-newPointNodeId').val('').focus();
        } catch (error) { RED.notify(error.message, 'error'); }
      });
      $('#node-input-newPointNodeId').on('keydown', function (event) {
        if (event.key === 'Enter') { event.preventDefault(); $('#node-input-addPoint').click(); }
      });
      $('#node-input-importPointList').on('click', () => $('#node-input-pointFile').click());
      $('#node-input-pointFile').on('change', function () {
        const file = this.files && this.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const imported = parse(reader.result);
            merge(imported);
            $('#node-input-pointListFileName').val(file.name);
            RED.notify(`${imported.length} point(s) imported`, 'success');
          } catch (error) { RED.notify(`Import failed: ${error.message}`, 'error'); }
          $('#node-input-pointFile').val('');
        };
        reader.readAsText(file);
      });
      $('#node-input-clearPointList').on('click', () => {
        points.clear();
        $('#node-input-nodeId').val('');
        $('#node-input-pointListFileName').val('');
        render();
      });
    },
    label: function () { return this.name || 'tier0-opcua-read'; }
  });
</script>
